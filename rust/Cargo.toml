[package]
name = "protoo"
version = "0.1.0"
edition = "2021"
description = "A minimalist and extensible signaling framework rewritten in Rust"
authors = ["OpenAI Assistant"]
license = "MIT"
repository = "https://github.com/versatica/protoo"
readme = "../README.md"

[dependencies]
async-trait = "0.1"
futures = "0.3"
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
